name: Main

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  APP_MODE: "ci"

jobs:
  backend-ci:
    uses: DCC-BS/ci-workflows/.github/workflows/python-backend-ci.yml@6d1cca8023e197f6e9cda5e64f3b3f0448f4cf6e # v9
    with:
      python_versions: '["3.13"]'
      quality_python_version: "3.13"
      check_command: "uv lock --locked && uv run ruff format --check && uv run ruff check && uv run ty check ./src/transcribo_backend"
      uv_version: 0.11.31
