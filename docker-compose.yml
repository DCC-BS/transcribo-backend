services:
  llm:
    platform: linux/amd64
    image: vllm/vllm-openai:v0.24.0
    container_name: llm
    ports:
      - "${LLM_API_PORT}:${LLM_API_PORT}"
    environment:
      - HF_TOKEN=${HF_TOKEN}
    env_file: ".env"
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    ipc: host
    volumes:
      - ${HUGGING_FACE_CACHE_DIR}:/root/.cache/huggingface
    command: >
      --port ${LLM_API_PORT}
      --model RedHatAI/gemma-4-31B-it-NVFP4
      --served-model-name Gemma/Gemma-4-31B
      --max-model-len auto
      --max-num-batched-tokens 4096
      --gpu-memory-utilization 0.90
      --enable-auto-tool-choice
      --tool-call-parser gemma4
      --chat-template examples/tool_chat_template_gemma4.jinja
      --mm-processor-kwargs '{"max_soft_tokens": 280}'
      --async-scheduling
      --tensor-parallel-size 1
      --max-num-seqs 1
      --reasoning-parser gemma4

  faster_whisper:
    image: quay.io/ktbs/fd-itbs/faster-whisper:v1.6.1
    ports:
      - "50001:50001"
    env_file: ".env"
    environment:
      - HF_TOKEN=${HF_TOKEN}
    deploy:
      resources:
        reservations:
          memory: 16g
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]
